plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'smartticketing'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// MySQL
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Web
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		if (project.hasProperty('coreOnly')) includeTags 'core'
	}
}

// 로컬 MySQL에 임시 DB를 생성하여 검증하고 종료 시 제거한다.
tasks.register('bookingFoundationTest', Test) {
	group = 'verification'
	description = 'Runs booking contracts against an isolated temporary MySQL database.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	outputs.upToDateWhen { false }
	filter {
		includeTestsMatching 'smartticketing.booking.*'
	}
}

// Explicit local-only k6 harness; creates and drops its own UUID MySQL schemas.
tasks.register('bookingRedisBenchmark', JavaExec) {
	dependsOn testClasses
	// Do not component-scan unit-test @Configuration classes in the benchmark server.
	def fixtureDir = layout.buildDirectory.dir('benchmark-fixture')
	classpath = files(fixtureDir) + sourceSets.main.runtimeClasspath
	doFirst {
		copy {
			from sourceSets.test.output.classesDirs
			include 'smartticketing/booking/BookingRedisBenchmark*.class', 'smartticketing/booking/QueryRedisBenchmark*.class', 'smartticketing/booking/BenchmarkProcess.class', 'smartticketing/booking/BenchmarkBackend.class', 'smartticketing/booking/TemporaryMysqlDatabase.class'
			into fixtureDir
		}
	}
	mainClass = System.getenv('BENCH_SUITE') && System.getenv('BENCH_SUITE') != 'booking' ? 'smartticketing.booking.QueryRedisBenchmark' : 'smartticketing.booking.BookingRedisBenchmark'
	maxHeapSize = '1536m'
	// Optional benchmark-only runtime; project compilation and normal bootRun stay on Java 21.
	if (System.getenv('BOOKING_LOAD_JAVA')) executable = System.getenv('BOOKING_LOAD_JAVA')
}
