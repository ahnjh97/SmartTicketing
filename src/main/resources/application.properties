spring.application.name=SmartTicketing
spring.config.import=optional:file:./.local/cache-mode.properties
# Shared switch: smart summaries, waiting ranks/repair and dispatch locks. QR Redis is independent.
# OFF keeps MySQL reads/allocation and Outbox enabled. Restart after changing the mode.
app.cache.enabled=${APP_CACHE_ENABLED:false}
# Read-only API query cache TTL. Cache OFF always uses the existing MySQL query path.
app.cache.query-ttl-ms=${APP_CACHE_QUERY_TTL_MS:2000}
# Main-page L1 cache is intentionally short so it only removes repeated Redis round-trips.
app.cache.main-local-ttl-ms=${APP_CACHE_MAIN_LOCAL_TTL_MS:500}

# Bounded burst backlog; Windows JDK 21 still caps this at 200 (JDK-8330940).
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:1024}

# 카카오 지도 선택 연동 (소셜 로그인과 별도로 설정)
kakao.map.rest-api-key=${KAKAO_MAP_REST_API_KEY:${KAKAO_CLIENT_ID:}}

# ==============================
# MySQL 데이터베이스 설정
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 좌석 준비에서 묶은 회차 UPDATE를 MySQL 드라이버에서도 묶어 전송한다.
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==============================
# JPA 데이터베이스 매핑 설정
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# SQL 원문/파라미터 대신 시작 시 테이블 및 데이터 준비 요약만 출력한다.
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.tool.schema=WARN
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# JWT 인증 토큰 설정
# ==============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# ==============================
# TMDB
# ==============================
tmdb.access-token=${TMDB_ACCESS_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3
