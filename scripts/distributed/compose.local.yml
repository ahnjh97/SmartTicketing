# Local functional verification only. NOT a physical two-host performance measurement.
services:
  backend-b:
    extends: {file: common.yml, service: backend}
    ports: ["${SERVER_A_IP}:8081:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  nginx:
    environment:
      SERVER_B_IP: backend-b
