services:
  mysql:
    image: mysql:8.4
    cpus: 2
    mem_limit: 1536m
    environment:
      MYSQL_ROOT_PASSWORD: ${BENCH_DB_PASSWORD:?test password required}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s
  redis:
    image: redis:7-alpine
    network_mode: service:mysql
    cpus: 1
    mem_limit: 256m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  runner:
    image: smartticketing-benchmark:java21-local
    build:
      context: ../..
      dockerfile: scripts/benchmark/Dockerfile
    network_mode: service:mysql
    cpus: 4
    mem_limit: 4g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOOKING_LOAD_TEST: "true"
      BOOKING_LOAD_SMOKE: ${BENCH_SMOKE:-false}
      BOOKING_LOAD_OUTPUT: /results/run
      BOOKING_TEST_MYSQL_USER: root
      BOOKING_TEST_MYSQL_PASSWORD: ${BENCH_DB_PASSWORD:?test password required}
      K6_BINARY: /usr/local/bin/k6
      TZ: Asia/Seoul
    volumes:
      - ${BENCHMARK_OUTPUT:?output path required}:/results
volumes:
  mysql-data:
