services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${BENCH_DB_PASSWORD:?test password required}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    image: ${BENCH_BACKEND_IMAGE:?backend image required}
    build:
      context: ${BENCHMARK_OUTPUT:?output path required}/image-context
      target: prebuilt
    environment:
      DB_PASSWORD: ${BENCH_DB_PASSWORD:?test password required}
      TZ: Asia/Seoul
  k6:
    image: grafana/k6:2.3.0
    user: "0:0"
    working_dir: /app
    volumes:
      - ../../k6:/app/k6:ro
      - ${BENCHMARK_OUTPUT:?output path required}:/results
  runner:
    image: smartticketing-benchmark:java21-local
    build:
      context: ../..
      dockerfile: scripts/benchmark/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOOKING_LOAD_TEST: "true"
      BENCH_SUITE: ${BENCH_SUITE:-booking}
      BENCH_CACHE_MODE: ${BENCH_CACHE_MODE:-compare}
      BENCH_RATE: ${BENCH_RATE:-50}
      BENCH_DURATION: ${BENCH_DURATION:-30s}
      BENCH_PRE_VUS: ${BENCH_PRE_VUS:-100}
      BENCH_MAX_VUS: ${BENCH_MAX_VUS:-1000}
      BENCH_LOGIN_USERS: ${BENCH_LOGIN_USERS:-100}
      BOOKING_LOAD_SMOKE: ${BENCH_SMOKE:-false}
      BOOKING_LOAD_OUTPUT: /results/run
      BOOKING_TEST_MYSQL_USER: root
      BOOKING_TEST_MYSQL_PASSWORD: ${BENCH_DB_PASSWORD:?test password required}
      BOOKING_TEST_MYSQL_HOST: mysql
      TZ: Asia/Seoul
    volumes:
      - ${BENCHMARK_OUTPUT:?output path required}:/results
volumes:
  mysql-data:
  redis-data:
