<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartTicketing · 테스트 결과</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c30;--line:#29344c;--muted:#9baac3;--text:#edf2fa;--accent:#7aebcd;--off:#95a8ff;--warn:#ffc48e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,'Malgun Gothic',sans-serif}main{max-width:1420px;margin:auto;padding:34px 28px 70px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:3px 0;font-size:32px;letter-spacing:-1px}h2{font-size:20px;margin:0 0 14px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:2px}.muted,small{color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:26px 0;border-bottom:1px solid var(--line);padding-bottom:12px}button,select{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px}button{cursor:pointer;white-space:nowrap}button[aria-selected=true]{background:var(--accent);color:#102624;border-color:var(--accent);font-weight:700}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--off);outline-offset:3px}.filters{display:flex;gap:16px;align-items:end;margin-bottom:20px;flex-wrap:wrap}label{display:grid;gap:6px;font-size:12px;color:var(--muted)}#run{max-width:780px;min-width:280px}.tag{display:inline-block;border:1px solid var(--line);border-radius:18px;padding:3px 10px;font-size:12px;margin:0 5px 5px 0}.good{color:var(--accent)}.warn{color:var(--warn)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.value{font-size:28px;font-weight:650;letter-spacing:-1px;margin-top:7px}.section{margin-top:18px}.notice{border-left:3px solid var(--accent);background:#1b2840;padding:13px 17px;margin:16px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}th:first-child,td:first-child{text-align:left}.bars{display:flex;align-items:center;gap:8px;min-width:220px}.bars i{display:block;height:8px;background:var(--off);border-radius:10px;min-width:2px}.bars .on{background:var(--accent)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:60px 16px;color:var(--muted)}footer{margin-top:25px;font-size:12px;color:var(--muted)}.history-button{padding:3px 8px;font-size:12px}.history{margin-top:28px}@media(max-width:800px){main{padding:22px 14px}header{display:block}h1{font-size:26px}.cards{grid-template-columns:repeat(2,1fr)}#run{min-width:0;width:100%;max-width:100%}.filters label:first-child{width:100%}.value{font-size:23px}}[hidden]{display:none!important}
</style></head><body><main>
<header><div><div class="eyebrow">SMART TICKETING / BENCHMARKS</div><h1>테스트 결과</h1><div class="muted">테스트별 결과와 실행 기록을 한곳에서 확인하세요.</div></div><small id="updated"></small></header>
<nav id="tabs" class="tabs" role="tablist" aria-label="테스트 종류"></nav>
<div class="filters"><label>실행 기록<select id="run" aria-label="실행 기록"></select></label><label>측정 종류<select id="kind"><option value="all">전체 기록</option><option value="load">부하 측정</option><option value="smoke">빠른 동작 확인</option></select></label></div>
<section id="panel" role="tabpanel" aria-live="polite"></section>
<section class="section history"><h2>실행 기록</h2><div class="scroll"><table><thead><tr><th>실행 시각</th><th>종류</th><th>Redis</th><th>결과</th><th>보기</th></tr></thead><tbody id="history"></tbody></table></div></section>
<footer>테스트가 끝나면 자동 집계됩니다. 새 결과가 생겼다면 이 페이지를 새로고침하세요. 다른 실행·환경의 수치를 합쳐 개선율을 계산하지 않습니다.</footer>
</main><script>
'use strict';
const DATA=/*REPORT_DATA*/;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2});
const time=value=>Number.isNaN(Date.parse(value))?value:new Date(value).toLocaleString('ko-KR',{hour12:false});
const mean=rows=>rows.length&&rows.every(r=>r.p95!=null)?rows.reduce((n,r)=>n+r.p95,0)/rows.length:null;
const sum=(rows,key)=>rows.reduce((n,r)=>n+(r[key]??0),0);
const params=new URLSearchParams(location.hash.slice(1));
let active=DATA.categories.some(c=>c[0]===params.get('tab'))?params.get('tab'):'all', selected=params.get('run')??'';
const status=r=>r.failed?'오류 / 미완료':r.rows.length?'측정 완료':'자료 확인 필요';
const mode=r=>r.suite==='login'?'비교 제외':r.requestedMode==='on'?'ON':r.requestedMode==='off'?'OFF':r.requestedMode==='compare'?'ON/OFF':'미기록';
const kind=r=>r.smoke===true?'동작 확인':r.smoke===false?'부하 측정':'종류 미기록';
function available(){return DATA.records.filter(r=>(active==='all'||r.rows.some(x=>x.category===active))&&($('kind').value==='all'||r.smoke!=null&&($('kind').value==='smoke')===r.smoke));}
function tabs(){ $('tabs').innerHTML=[['all','전체'],...DATA.categories].map(([id,label])=>`<button role="tab" id="tab-${id}" aria-controls="panel" aria-selected="${id===active}" tabindex="${id===active?0:-1}" data-tab="${id}">${label}</button>`).join(''); }
function render(){
    tabs();const records=available();if(!records.some(r=>r.id===selected))selected=records[0]?.id??'';
    $('run').innerHTML=records.map(r=>`<option value="${esc(r.id)}">${esc(time(r.date))} · ${kind(r)} · ${mode(r)} · ${esc(r.id)}</option>`).join('');$('run').value=selected;
    $('panel').setAttribute('aria-labelledby','tab-'+active);
    $('history').innerHTML=records.map(r=>`<tr><td>${esc(time(r.date))}</td><td>${kind(r)}</td><td>${mode(r)}</td><td class="${r.failed?'warn':'muted'}">${status(r)}</td><td><button class="history-button" data-run="${esc(r.id)}">선택</button></td></tr>`).join('');
    const record=records.find(r=>r.id===selected);
    if(!record){$('panel').innerHTML='<div class="empty">이 조건에 해당하는 결과가 없습니다.<br>테스트를 실행하거나 측정 종류 필터를 바꿔주세요.</div>';return;}
    const rows=record.rows.filter(r=>active==='all'||r.category===active),failed=rows.filter(r=>!r.valid).length;
    const errors=rows.some(r=>r.errorRate>0),requests=sum(rows,'requests');
    const groups=[...new Set(rows.map(r=>r.id))].map(id=>{
        const cells=rows.filter(r=>r.id===id),off=mean(cells.filter(r=>r.mode==='OFF')),on=mean(cells.filter(r=>r.mode==='ON'));
        const valid=!record.smoke&&!record.failed&&cells.every(r=>r.valid)&&off>0&&on!=null;
        const reason=record.smoke?'동작 확인용':cells.some(r=>!r.valid)||record.failed?'비교 보류':id==='login'?'비교 대상 아님':off==null||on==null?'단독 측정':'—';
        return {label:cells[0].label,off,on,valid,change:valid?(on/off-1)*100:null,reason};
    });
    const links=record.reports.map(r=>`<a href="${esc(r.href)}" target="_blank" rel="noopener">${esc(r.name)} ↗</a>`).join('')+(record.log?`<a href="${esc(record.log)}" target="_blank" rel="noopener">실행 로그 ↗</a>`:'');
    $('panel').innerHTML=`<div><span class="tag">${esc(record.os||'환경 미기록')}</span><span class="tag">Java ${esc(record.java||'미기록')}</span><span class="tag">Redis ${mode(record)}</span><span class="tag ${record.smoke?'warn':''}">${record.smoke?'빠른 동작 확인':'부하 측정'}</span><span class="tag">${record.isolated?'항목별 JVM·DB 격리':'이전 실행 조건'}</span></div>
      <div class="links">${links}</div>
      <div class="notice">${record.smoke?'짧은 동작 확인 결과입니다. 성능 개선율을 해석하지 마세요.':'선택한 실행 내부의 ON/OFF만 비교합니다. p95는 각 구간 p95의 산술평균이며 전체 요청을 합친 p95가 아닙니다.'}${record.notes.map(n=>'<br>'+esc(n)).join('')}</div>
      <div class="cards"><div class="card"><small>측정 구간</small><div class="value">${rows.length}</div></div><div class="card"><small>HTTP 요청</small><div class="value">${fmt(requests)}</div></div><div class="card"><small>실패 / 부하 미달 구간</small><div class="value ${failed?'warn':'good'}">${failed}</div></div><div class="card"><small>HTTP 오류</small><div class="value ${errors?'warn':'good'}">${!rows.length?'—':errors?'있음':rows.some(r=>r.errorRate==null)?'미기록':'없음'}</div></div></div>
      <div class="section"><h2>ON/OFF 응답 시간</h2><div class="scroll"><table><thead><tr><th>항목</th><th>OFF p95 ms</th><th>ON p95 ms</th><th>p95 비교</th><th>변화</th></tr></thead><tbody>${groups.map(g=>{const max=Math.max(g.off??0,g.on??0,1);return `<tr><td>${esc(g.label)}</td><td>${fmt(g.off)}</td><td>${fmt(g.on)}</td><td><div class="bars"><span>OFF</span><i style="width:${(g.off??0)/max*90}px"></i><span>ON</span><i class="on" style="width:${(g.on??0)/max*90}px"></i></div></td><td class="${g.valid?(g.change<=0?'good':'warn'):'muted'}">${g.valid?(g.change>0?'+':'')+fmt(g.change)+'%':g.reason}</td></tr>`;}).join('')}</tbody></table></div></div>
      <div class="section"><h2>구간별 원본 결과</h2><div class="scroll"><table><thead><tr><th>항목 / 구간</th><th>Redis</th><th>p95 ms</th><th>p99 ms</th><th>HTTP/s</th><th>HTTP 실패 %</th><th>기능 실패</th><th>누락 반복</th><th>원본</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.label)} / ${esc(r.run)}${r.load?'<br><small>'+esc(r.load)+'</small>':''}</td><td>${esc(r.mode)}</td><td>${fmt(r.p95)}</td><td>${fmt(r.p99)}</td><td>${fmt(r.rps)}</td><td>${fmt(r.errorRate==null?null:r.errorRate*100)}</td><td>${r.failure}</td><td>${r.dropped}</td><td>${r.raw?`<a href="${esc(r.raw)}" target="_blank" rel="noopener">JSON ↗</a>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
    const hash=new URLSearchParams({tab:active,run:selected}).toString();try{history.replaceState(null,'','#'+hash);}catch{}
}
$('tabs').addEventListener('click',e=>{const button=e.target.closest('[data-tab]');if(button){active=button.dataset.tab;render();$('tab-'+active).focus();}});
$('tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const ids=['all',...DATA.categories.map(c=>c[0])],index=ids.indexOf(active);active=e.key==='Home'?ids[0]:e.key==='End'?ids.at(-1):ids[(index+(e.key==='ArrowRight'?1:ids.length-1))%ids.length];e.preventDefault();render();$('tab-'+active).focus();});
$('run').addEventListener('change',()=>{selected=$('run').value;render();});$('kind').addEventListener('change',render);
$('history').addEventListener('click',e=>{const button=e.target.closest('[data-run]');if(button){selected=button.dataset.run;render();$('run').focus();}});
$('updated').textContent='집계 '+time(DATA.generatedAt);render();
</script></body></html>
