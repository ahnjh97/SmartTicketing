<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="후보 탐색과 잠금 후 재검증"><title>후보 탐색과 잠금 후 재검증</title><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#66768b" stroke-width="1.5"></path></marker><marker id="retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#66768b" stroke-width="1.5"></path></marker></defs><rect width="1000" height="300" rx="18" fill="#f8fafc"></rect><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"><path d="M226 138H274" fill="none" stroke="#66768b" stroke-width="2" stroke-linejoin="round" marker-end="url(#normal)"></path><path d="M476 138H530" fill="none" stroke="#66768b" stroke-width="2" stroke-linejoin="round" marker-end="url(#normal)"></path><path d="M720 138H747V102H774" fill="none" stroke="#66768b" stroke-width="2" stroke-linejoin="round" marker-end="url(#normal)"></path><path d="M625 198V238H774" fill="none" stroke="#66768b" stroke-width="2" stroke-linejoin="round" marker-end="url(#normal)"></path><path d="M375 100V36H125V100" fill="none" stroke="#66768b" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#retry)"></path><rect x="24" y="100" width="202" height="76" rx="14" fill="#ffffff" stroke="#7b8798" stroke-width="1.5"></rect><text x="125" y="131" text-anchor="middle" font-size="19" fill="#172c45" font-weight="600">후보 탐색</text><text x="125" y="155" text-anchor="middle" font-size="14" fill="#66768b" font-weight="400">선점 가능 여부 조회</text><rect x="274" y="100" width="202" height="76" rx="14" fill="#edf4ff" stroke="#3569ad" stroke-width="1.5"></rect><text x="375" y="131" text-anchor="middle" font-size="19" fill="#244d80" font-weight="600">회차·구역 잠금</text><text x="375" y="155" text-anchor="middle" font-size="14" fill="#66768b" font-weight="400">좌석·대기 상태 재확인</text><path d="M530 138L625 78L720 138L625 198Z" fill="#ffffff" stroke="#7b8798" stroke-width="1.5" stroke-linejoin="round"></path><text x="625" y="145" text-anchor="middle" font-size="18" fill="#172c45" font-weight="600">선점 가능?</text><rect x="774" y="64" width="202" height="76" rx="14" fill="#ffffff" stroke="#7b8798" stroke-width="1.5"></rect><text x="875" y="95" text-anchor="middle" font-size="19" fill="#172c45" font-weight="600">선택 좌석 잠금</text><text x="875" y="119" text-anchor="middle" font-size="14" fill="#66768b" font-weight="400">재검증 후 5분 선점</text><rect x="774" y="200" width="202" height="76" rx="14" fill="#ffffff" stroke="#7b8798" stroke-width="1.5"></rect><text x="875" y="231" text-anchor="middle" font-size="19" fill="#172c45" font-weight="600">대기 등록</text><text x="875" y="255" text-anchor="middle" font-size="14" fill="#66768b" font-weight="400">취소표 발생 시 자동 선점</text><g data-label="true"><rect fill="#f8fafc" rx="2" x="183.6171875" y="22" width="132.765625" height="20"></rect><text x="250" y="38" text-anchor="middle" font-size="14" fill="#66768b" font-weight="500">상태 변경 시 재탐색</text></g><g data-label="true"><rect fill="#f8fafc" rx="2" x="727" y="62" width="34" height="20"></rect><text x="744" y="78" text-anchor="middle" font-size="14" fill="#66768b" font-weight="500">가능</text></g><g data-label="true"><rect fill="#f8fafc" rx="2" x="678" y="224" width="34" height="20"></rect><text x="695" y="240" text-anchor="middle" font-size="14" fill="#66768b" font-weight="500">불가</text></g></g></svg>