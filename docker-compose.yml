services:
  mysql:
    image: mysql:8.4
    container_name: smartticketing-mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_ticketing}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartticketing

  redis:
    image: redis:7-alpine
    container_name: smartticketing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - redis_data:/data
    networks:
      - smartticketing

  admission-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - admission_redis_data:/data
    networks:
      - smartticketing

  backend:
    image: ${BACKEND_IMAGE:-smartticketing-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BACKEND_BUILD_TARGET:-source}
    container_name: smartticketing-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      admission-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://localhost:8080/api/health/readiness >/dev/null"]
      interval: 10s
      timeout: 12s
      retries: 48
      start_period: 120s
    environment:
      OAUTH2_REDIRECT_BASE_URL: https://smartticketing.duckdns.org
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smart_ticketing}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      ADMIN_KEY: ${ADMIN_KEY}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      KAKAO_MAP_REST_API_KEY: ${KAKAO_MAP_REST_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      FRONTEND_URL: https://smartticketing.duckdns.org
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SPRING_DATA_REDIS_HOST: redis
      REDIS_PORT: 6379
      # Smart-booking advisory summaries; MySQL remains authoritative for allocation.
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-false}
      ADMISSION_ENABLED: ${ADMISSION_ENABLED:-true}
      ADMISSION_CAPACITY: ${ADMISSION_CAPACITY:-100}
      ADMISSION_BATCH_SIZE: ${ADMISSION_BATCH_SIZE:-10}
      ADMISSION_ACTIVE_SECONDS: ${ADMISSION_ACTIVE_SECONDS:-600}
      ADMISSION_WAIT_SECONDS: ${ADMISSION_WAIT_SECONDS:-90}
      ADMISSION_MAX_WAITING: ${ADMISSION_MAX_WAITING:-20000}
      ADMISSION_SECURE_COOKIE: "true"
      ADMISSION_REDIS_HOST: admission-redis
    expose:
      - "8080"
    networks:
      - smartticketing

  frontend:
    image: ${FRONTEND_IMAGE:-smartticketing-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_KAKAO_MAP_JS_KEY: ${VITE_KAKAO_MAP_JS_KEY:?VITE_KAKAO_MAP_JS_KEY must be set}
        VITE_BASE_PATH: /
    container_name: smartticketing-frontend
    environment:
      VITE_KAKAO_MAP_JS_KEY: ${VITE_KAKAO_MAP_JS_KEY:?VITE_KAKAO_MAP_JS_KEY must be set}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    expose:
      - "80"
    networks:
      - smartticketing

  nginx:
    image: nginx:alpine
    container_name: smartticketing-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - smartticketing
  certbot:
    profiles: ["maintenance"]
    image: certbot/certbot:latest
    container_name: smartticketing-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - smartticketing
volumes:
  admission_redis_data:
  mysql_data:
  redis_data:

networks:
  smartticketing:
