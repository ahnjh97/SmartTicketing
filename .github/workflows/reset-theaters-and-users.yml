name: Reset theater and account data

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Delete ALL members (including admin), social logins, theaters and bookings; keep movies. Type RESET_THEATERS_AND_USERS'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  reset:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reset theaters, bookings and all accounts on EC2
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == RESET_THEATERS_AND_USERS ]] || { echo 'Invalid confirmation'; exit 1; }
          : "${AWS_HOST:?Set AWS_HOST}"
          : "${AWS_USERNAME:?Set AWS_USERNAME}"
          : "${AWS_SSH_KEY:?Set AWS_SSH_KEY}"
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/smartticketing-key.pem' EXIT
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/smartticketing-key.pem
          chmod 600 ~/.ssh/smartticketing-key.pem
          # Same host-key discovery as the existing deployment workflow.
          host_key_ready=false
          for attempt in 1 2 3; do
            if ssh-keyscan -4 -T 30 -t ed25519,rsa -H "$AWS_HOST" > ~/.ssh/known_hosts && test -s ~/.ssh/known_hosts; then
              host_key_ready=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          [[ "$host_key_ready" == true ]] || { echo 'Could not fetch the EC2 host key'; exit 1; }
          ssh_options=(-4 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30
            -o ConnectionAttempts=3 -o ServerAliveInterval=30 -o ServerAliveCountMax=6
            -i ~/.ssh/smartticketing-key.pem)
          { printf 'cleanup_sql_base64=%q\n' "$(base64 -w0 deploy/reset-theaters-and-users.sql)"; cat deploy/reset-theaters.sh; } |
            ssh "${ssh_options[@]}" "$AWS_USERNAME@$AWS_HOST" 'bash -s -- RESET_THEATERS_AND_USERS'
      - name: Verify public HTTPS and APIs
        run: python3 deploy/smoke-test.py https://smartticketing.duckdns.org
