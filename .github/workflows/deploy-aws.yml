name: Test and deploy SmartTicketing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_tests:
        description: 'Run all regression tests and Docker image-store compatibility checks before deployment'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Core frontend tests
        if: ${{ !inputs.full_tests }}
        run: npm run test:core
      - name: Full frontend tests
        if: ${{ inputs.full_tests }}
        run: npm test
      # The production frontend is built once, in the containers job.
      - name: Check deployment scripts
        working-directory: .
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/image-fingerprint.sh
          bash -n deploy/check-image-portability.sh
          bash -n deploy/check-frontend-container.sh
          bash -n deploy/check-backend-container.sh
          bash -n deploy/admin-secret.sh
          bash -n deploy/reset-theaters.sh
          sh -n deploy/backend-entrypoint.sh
          sh -n frontend/docker/40-runtime-config.sh
      - name: Deployment regression tests (full suite)
        if: ${{ inputs.full_tests }}
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
        working-directory: .

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=6
    env:
      BOOKING_TEST_MYSQL_USER: root
      BOOKING_TEST_MYSQL_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # core includes booking correctness, Outbox delivery and Redis recovery suites.
      - name: Core booking, Outbox and Redis tests and JAR
        if: ${{ !inputs.full_tests }}
        run: bash gradlew test bootJar -PcoreOnly --no-daemon
      - name: Full backend tests and JAR
        if: ${{ inputs.full_tests }}
        run: bash gradlew test bootJar --no-daemon
      - name: Package tested backend JAR
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -type f)
          test "${#jars[@]}" -eq 1
          mkdir -p build/deploy
          cp "${jars[0]}" build/deploy/app.jar
          cd build/deploy
          sha256sum app.jar > app.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: build/deploy/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: build/reports/tests/test/
          if-no-files-found: ignore

  containers:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND_IMAGE: smartticketing-backend:${{ github.sha }}
      FRONTEND_IMAGE: smartticketing-frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: build/deploy
      - name: Build backend production image
        run: |
          (cd build/deploy && sha256sum --check app.jar.sha256)
          docker build --target prebuilt -t "$BACKEND_IMAGE" .
      - name: Build frontend production image
        run: >-
          docker build -t "$FRONTEND_IMAGE"
          --build-arg VITE_KAKAO_MAP_JS_KEY=
          --build-arg VITE_API_BASE_URL=
          --build-arg VITE_BASE_PATH=/ frontend
      - name: Validate container entrypoints
        run: |
          expected=$(cut -d ' ' -f 1 build/deploy/app.jar.sha256)
          actual=$(docker run --rm --entrypoint sha256sum "$BACKEND_IMAGE" /app/app.jar | cut -d ' ' -f 1)
          test "$actual" = "$expected"
          docker run --rm --entrypoint sh "$BACKEND_IMAGE" -n /app/backend-entrypoint.sh
          docker run --rm -e VITE_KAKAO_MAP_JS_KEY=ciRuntimeKey "$FRONTEND_IMAGE" nginx -t
      - name: Verify frontend runtime configuration over HTTP
        run: bash deploy/check-frontend-container.sh
      - name: Boot tested backend image with MySQL and Redis
        timeout-minutes: 8
        run: bash deploy/check-backend-container.sh
      - name: Export verified images
        run: |
          set -euo pipefail
          mkdir -p build/images
          bash deploy/image-fingerprint.sh "$BACKEND_IMAGE" > build/images/backend.fingerprint
          bash deploy/image-fingerprint.sh "$FRONTEND_IMAGE" > build/images/frontend.fingerprint
          docker save "$BACKEND_IMAGE" "$FRONTEND_IMAGE" | gzip -1 > build/images/images.tar.gz
          (cd build/images && sha256sum images.tar.gz > images.tar.gz.sha256)
      - name: Verify images across Docker image stores
        if: ${{ inputs.full_tests }}
        timeout-minutes: 5
        run: bash deploy/check-image-portability.sh
      - uses: actions/upload-artifact@v4
        with:
          name: production-images-${{ github.sha }}
          path: build/images/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  deploy:
    needs: [frontend, backend, containers]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: aws-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production-images-${{ github.sha }}
          path: build/images
      - name: Deploy tested commit to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${AWS_HOST:?Set AWS_HOST}"
          : "${AWS_USERNAME:?Set AWS_USERNAME}"
          : "${AWS_SSH_KEY:?Set AWS_SSH_KEY}"
          # Validate before connecting; never print the generated secret assignment.
          bash deploy/admin-secret.sh > /dev/null
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_ID" =~ ^[0-9]+-[0-9]+$ ]]
          (cd build/images && sha256sum --check images.tar.gz.sha256)
          IMAGES_SHA256=$(sha256sum build/images/images.tar.gz | cut -d ' ' -f 1)
          BACKEND_FINGERPRINT=$(cat build/images/backend.fingerprint)
          FRONTEND_FINGERPRINT=$(cat build/images/frontend.fingerprint)
          [[ "$BACKEND_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/smartticketing-key.pem' EXIT
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/smartticketing-key.pem
          chmod 600 ~/.ssh/smartticketing-key.pem
          # Discover the server key on the runner without a separate known-hosts secret.
          # This trusts the key returned by the network rather than an independently pinned key.
          echo 'Fetching the EC2 SSH host key on port 22...'
          host_key_ready=false
          for attempt in 1 2 3; do
            echo "SSH host key attempt $attempt/3"
            if ssh-keyscan -4 -T 30 -t ed25519,rsa -H "$AWS_HOST" > ~/.ssh/known_hosts && test -s ~/.ssh/known_hosts; then
              host_key_ready=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$host_key_ready" != true ]; then
            echo '::error::No SSH host key received after three attempts. Verify AWS_HOST matches the current EC2 public address and that port 22 allows this GitHub runner. SSH authentication and deployment have not started.'
            exit 1
          fi
          echo 'SSH host key received. Connecting to EC2...'
          ssh_options=(-4 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30
            -o ConnectionAttempts=3 -o ServerAliveInterval=30 -o ServerAliveCountMax=6
            -i ~/.ssh/smartticketing-key.pem)
          echo 'Uploading the verified backend and frontend images...'
          ssh "${ssh_options[@]}" "$AWS_USERNAME@$AWS_HOST" \
            "umask 077; mkdir -p ~/.smartticketing-artifacts && cat > ~/.smartticketing-artifacts/$DEPLOY_ID.tar.gz" \
            < build/images/images.tar.gz
          { bash deploy/admin-secret.sh; cat deploy/image-fingerprint.sh deploy/deploy.sh; } | \
            ssh "${ssh_options[@]}" "$AWS_USERNAME@$AWS_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$DEPLOY_ID' '$IMAGES_SHA256' '$BACKEND_FINGERPRINT' '$FRONTEND_FINGERPRINT'"
      - name: Verify public HTTPS and JSON APIs
        run: python3 deploy/smoke-test.py https://smartticketing.duckdns.org
