name: Test and deploy SmartTicketing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check deployment scripts
        working-directory: .
        run: |
          bash -n deploy/deploy.sh
          sh -n deploy/backend-entrypoint.sh
          python3 -m unittest discover -s deploy -p 'test_*.py'

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=6
    env:
      BOOKING_TEST_MYSQL_USER: root
      BOOKING_TEST_MYSQL_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: bash gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: build/reports/tests/test/
          if-no-files-found: ignore

  containers:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build -t smartticketing-backend:ci .
      - name: Build frontend production image
        run: >-
          docker build -t smartticketing-frontend:ci
          --build-arg VITE_KAKAO_MAP_JS_KEY=ci-build-placeholder
          --build-arg VITE_API_BASE_URL=
          --build-arg VITE_BASE_PATH=/ frontend
      - name: Validate container entrypoints
        run: |
          docker run --rm --entrypoint sh smartticketing-backend:ci -n /app/backend-entrypoint.sh
          docker run --rm smartticketing-frontend:ci nginx -t

  deploy:
    needs: [frontend, backend, containers]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: aws-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy tested commit to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${AWS_HOST:?Set AWS_HOST}"
          : "${AWS_USERNAME:?Set AWS_USERNAME}"
          : "${AWS_SSH_KEY:?Set AWS_SSH_KEY}"
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/smartticketing-key.pem' EXIT
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/smartticketing-key.pem
          chmod 600 ~/.ssh/smartticketing-key.pem
          # Discover the server key on the runner; only the existing three secrets are needed.
          # This trusts the key returned by the network rather than an independently pinned key.
          ssh-keyscan -T 10 -H "$AWS_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i ~/.ssh/smartticketing-key.pem "$AWS_USERNAME@$AWS_HOST" \
            "bash -s -- '$DEPLOY_SHA'" < deploy/deploy.sh
      - name: Verify public HTTPS and JSON APIs
        run: python3 deploy/smoke-test.py https://smartticketing.duckdns.org
